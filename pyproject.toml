[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dase7508-memory-lab"
version = "0.1.0"
description = "Controlled synthetic cross-user memory disclosure experiment"
requires-python = ">=3.11,<3.13"
dependencies = ["chromadb>=1.0,<2", "openai>=1.0,<3", "pydantic>=2.8,<3", "PyYAML>=6,<7", "pandas>=2,<3", "matplotlib>=3.8,<4", "streamlit>=1.40,<2", "python-dotenv>=1,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
memory-lab = "memory_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["embedding: requires downloaded local embedding model"]
